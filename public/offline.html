<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e3a5f">
<title>You are offline · The Grand Strategist</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 18px; line-height: 1.5; color: #111827; background: #ffffff; }
  header { border-bottom: 1px solid #d1d5db; padding: 12px 16px; }
  .brand { font-family: Georgia, "Times New Roman", serif; font-size: 20px; font-weight: 700; color: #1e3a5f; text-decoration: none; }
  main { max-width: 36rem; margin: 0 auto; padding: 32px 16px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 30px; line-height: 1.2; margin: 0 0 16px; }
  p { margin: 0 0 16px; font-size: 20px; }
  .actions { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; }
  button, a.button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 20px; border-radius: 6px; font-size: 18px; font-weight: 700; text-decoration: none; cursor: pointer; }
  button { background: #1e3a5f; color: #ffffff; border: none; }
  a.button { border: 2px solid #1e3a5f; color: #1e3a5f; background: #ffffff; }
  button:focus-visible, a:focus-visible { outline: 3px solid #b45309; outline-offset: 2px; }
</style>
</head>
<body>
<header><a class="brand" href="/">The Grand Strategist</a></header>
<main>
  <h1>You are offline</h1>
  <p>This page needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
  <p>Anything you were typing in a Dispatch is kept on this device until you can post it.</p>
  <div class="actions">
    <button type="button" onclick="location.reload()">Try again</button>
    <a class="button" href="/">Go to the home page</a>
  </div>
</main>
</body>
</html>
